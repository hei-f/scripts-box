name: Release Desktop App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 bun
        uses: oven-sh/setup-bun@v1

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: bun install

      - name: 构建 Tauri 应用
        run: bun run tauri build

      - name: 上传 macOS .app 产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: src-tauri/target/release/bundle/macos/*.app

      - name: 上传 macOS .dmg 产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 bun
        uses: oven-sh/setup-bun@v1

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: bun install

      - name: 构建 Tauri 应用
        run: bun run tauri build

      - name: 上传 Windows .exe 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取上一个 tag
        id: prev-tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "prev_tag=${PREV_TAG}" >> $GITHUB_OUTPUT

      - name: 生成 Release Notes
        id: notes
        run: |
          VERSION=${{ github.ref_name }}
          PREV_TAG=${{ steps.prev-tag.outputs.prev_tag }}

          # 生成 changelog
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --oneline --no-merges | head -20)
          else
            CHANGELOG=$(git log --oneline --no-merges | head -20)
          fi

          # 写入文件（用于多行内容）
          echo "## 更改日志" > release_notes.md
          echo "" >> release_notes.md
          echo "$CHANGELOG" | while read line; do
            echo "- $line" >> release_notes.md
          done
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "**下载链接**：" >> release_notes.md
          echo "- macOS: \`.dmg\` 安装包" >> release_notes.md
          echo "- Windows: \`.exe\` 安装包" >> release_notes.md

      - name: 下载 macOS .app 产物
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: artifacts/macos-app

      - name: 下载 macOS .dmg 产物
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/macos-dmg

      - name: 下载 Windows .exe 产物
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: artifacts/windows-exe

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos-app/*.app
            artifacts/macos-dmg/*.dmg
            artifacts/windows-exe/*.exe
          body_path: release_notes.md
          generate_release_notes: true
